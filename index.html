<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Receiver</title>
    <style>
        body { font-family: Arial; background: #000000; color: white; text-align: center; margin: 0; padding: 10px; overflow: hidden; }
        #tv-video { width: 100vw; height: 80vh; background: #111; object-fit: contain; }
        .info-box { padding: 10px; font-size: 20px; background: rgba(255,255,255,0.1); border-radius: 5px; margin: 10px; }
    </style>
</head>
<body>
    <div class="info-box" id="status">Iniaayos ang koneksyon ng TV...</div>
    
    <!-- Dito mapapanood ang screen ng phone mo -->
    <video id="tv-video" autoplay playsinline controls></video>

    <script src="peerjs.min.js"></script>
    <script>
        // Gumawa ng permanenteng madaling pangalan para sa TV mo
        const peer = new Peer('aking-android-tv-999'); 

        const statusDiv = document.getElementById('status');
        const tvVideo = document.getElementById('tv-video');

        peer.on('open', (id) => {
            statusDiv.innerHTML = "TV READY! Ilagay ang ID na ito sa iyong phone: <b style='color:#00ff00; font-size:24px;'>" + id + "</b>";
        });

        peer.on('call', (call) => {
            statusDiv.innerText = "May pumapasok na screen cast mula sa phone...";
            call.answer(); // Automatic na sasagutin ng TV ang cast ng phone
            
            call.on('stream', (remoteStream) => {
                tvVideo.srcObject = remoteStream;
                statusDiv.innerText = "Status: Live Casting Na!";
            });
        });

        peer.on('error', (err) => {
            statusDiv.innerText = "May Error: " + err.type;
        });
    </script>
</body>
</html>
