plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.iyongpangalan.nativegallery"
    compileSdk 34

    defaultConfig {
        applicationId "com.iyongpangalan.nativegallery"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    // Dito binabasa ang Keystore galing sa GitHub Actions configs
    signingConfigs {
        release {
            def keystoreFile = System.getenv("KEYSTORE_FILE") ?: "dccarlobos-key.jks"
            storeFile file(keystoreFile)
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}