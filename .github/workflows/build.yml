name: Build Screen Mirror Signed APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # 1. Kunin ang source code mula sa repository
      - name: Checkout source
        uses: actions/checkout@v6


      # 2. Setup JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''


      # 4. Install required Android SDK packages
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"


      # 5. Install exact Gradle version
      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'


      # 6. Generate Gradle Wrapper automatically
      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.13


      # 7. Check Gradle version
      - name: Verify Gradle
        run: |
          ./gradlew --version


      # 8. Decode the private keystore
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > dccarlobos-key.jks
          ls -l dccarlobos-key.jks


      # 9. Build signed Release APK
      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PKEYSTORE_FILE=dccarlobos-key.jks \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASSWORD"


      # 10. Upload signed APK
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenMirror-SignedAPK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error