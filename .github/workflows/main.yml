name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Set up JDK 17
      uses: actions/setup-java@v5 # Ini-update mula v4 papuntang v5 para mawala ang deprecation warning
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova Project
      run: |
        cordova create MyCastApp com.example.mycastapp MyCastApp
        cd MyCastApp
        cordova platform add android
        
        # Mga plugins para sa screen recording hardware at permissions
        cordova plugin add cordova-plugin-android-permissions
        cordova plugin add https://github.com
        
        rm -rf www/*
        cp -r ../index.html www/
        cp -r ../peerjs.min.js www/

    - name: Restore Keystore
      run: |
        cd MyCastApp
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > dccarlobos-key.jks

    - name: Build Signed Release APK
      run: |
        cd MyCastApp
        cordova build android --release \
        -- --keystore=dccarlobos-key.jks \
        --storePassword=${{ secrets.KEYSTORE_PASSWORD }} \
        --alias=${{ secrets.KEY_ALIAS }} \
        --password=${{ secrets.KEY_PASSWORD }}

    - name: Upload Android Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-build
        path: |
          MyCastApp/platforms/android/**/*.apk
          MyCastApp/platforms/android/**/*.aab
