name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova Project
      run: |
        cordova create MyCastApp com.example.mycastapp MyCastApp
        cd MyCastApp
        cordova platform add android
        rm -rf www/*
        cp -r ../index.html www/
        cp -r ../peerjs.min.js www/

    - name: Build Android APK
      run: |
        cd MyCastApp
        cordova build android --release

    # HAKBANG NA NAGHAHANAP AT NAGLILIPAT NG APK PARA SIGURADONG MAKUHA
    - name: Find and Move APK
      run: |
        mkdir -p output-apk
        find MyCastApp/platforms/android/ -name "*.apk" -exec cp {} output-apk/ \;
        echo "Mga nahanap na APK file:"
        ls -l output-apk/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-cast-app-apk
        path: output-apk/
